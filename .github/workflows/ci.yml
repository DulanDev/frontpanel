name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pinned: ubuntu-latest moves to a new release on its own schedule.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build first: the showcase typechecks against the built @frontpanel/vue, as a consumer would.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # The generated CSS is committed; a hand edit, or a source change without a rebuild, fails here.
      - name: Generated CSS matches its source
        run: git diff --exit-code -- packages/css
